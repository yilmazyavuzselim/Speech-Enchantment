# Speech-Enhancement Central Configuration
project:
  name: "Speech-Enhancement"
  seed: 42

dataset:
  name: "University of Edinburgh Noisy Speech Database (VoiceBank-DEMAND)"
  doi: "10.7488/ds/2117"
  handle: "10283/2791"
  orig_sample_rate: 48000
  sample_rate: 16000
  channels: 1
  segment_seconds: 4.0
  stride_seconds: 2.0
  pad: true
  val_speakers:
    - "p226"
    - "p287"
  test_speakers:
    - "p232"
    - "p257"

model:
  name: "demucs"
  checkpoint_name: "dns48"
  hidden: 48
  sample_rate: 16000
  chin: 1
  chout: 1
  causal: true
  resample: 4
  depth: 5
  kernel_size: 8
  stride: 4
  normalize: true

loss:
  l1_weight: 1.0
  stft_loss: true
  # Weights are applied once in the trainer/caller:
  # total_loss = l1_loss + stft_sc_factor * sc_loss + stft_mag_factor * mag_loss
  stft_sc_factor: 0.1
  stft_mag_factor: 0.1
  fft_sizes: [1024, 2048, 512]
  hop_sizes: [120, 240, 50]
  win_lengths: [600, 1200, 240]

training:
  # Initial experimental settings (to be profiled in Google Colab)
  optim: "adam"
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0
  batch_size: 16
  epochs: 15
  grad_clip_max_norm: 5.0
  num_workers: 2

baseline:
  method: "spectral_gating"
  stationary: true
  n_fft: 512
  win_length: 512
  hop_length: 128
  n_std_thresh_stationary: 1.5
  prop_decrease: 1.0

evaluation:
  sample_rate: 16000
  pesq_mode: "wb"
  stoi_extended: false

paths:
  drive_root: "/content/drive/MyDrive/Speech-Enhancement"
  raw_zips_dir: "/content/drive/MyDrive/Speech-Enhancement/data/raw_48k_zips"
  tar_16k_path: "/content/drive/MyDrive/Speech-Enhancement/data/edinburgh_16k.tar"
  local_data_16k_dir: "/content/data_16k"
  manifests_dir: "manifests"
  checkpoints_dir: "/content/drive/MyDrive/Speech-Enhancement/checkpoints"
  results_dir: "/content/drive/MyDrive/Speech-Enhancement/results"
